<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d">
  <title id="t">Un dossier par environnement</title>
  <desc id="d">Dans le dépôt de déploiement, branche main : deploy/hello/base est commun et part dans les deux clusters ; deploy/hello/dev est lu par le cluster dev (hello-dev.alson-lab.fr) ; deploy/hello/prod est lu par le cluster prod (hello.alson-lab.fr).</desc>
  <style>
    .cadre { fill: #ffffff; stroke: #e6e6e6; }
    .carte { fill: #f5f5f5; }
    .dev { fill: #eef7f1; stroke: #b9dcc6; stroke-width: 1.5; }
    .prod { fill: #eef3fc; stroke: #b8cdee; stroke-width: 1.5; }
    .entete { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #888888; text-anchor: middle; letter-spacing: 0.04em; }
    .code { font: 600 16px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1a1a1a; text-anchor: middle; }
    .titre { font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1a1a1a; text-anchor: middle; }
    .sous { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #666666; text-anchor: middle; }
    .note { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #666666; text-anchor: middle; }
    .fleche { stroke: #9a9a9a; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .commun { stroke: #9a9a9a; stroke-width: 1.5; fill: none; stroke-dasharray: 4 4; }
    @media (prefers-color-scheme: dark) {
      .cadre { fill: #0d1117; stroke: #30363d; }
      .carte { fill: #161b22; }
      .dev { fill: #12261a; stroke: #2f6b45; }
      .prod { fill: #121d33; stroke: #34558f; }
      .code, .titre { fill: #e6edf3; }
      .entete, .sous, .note { fill: #9aa4ae; }
      .fleche, .commun { stroke: #6e7681; }
    }
  </style>
  <rect class="cadre" x="1" y="1" width="758" height="328" rx="14"/>
  <text class="entete" x="202" y="34">DÉPÔT DE DÉPLOIEMENT (MAIN)</text>
  <text class="entete" x="598" y="34">CLUSTERS</text>

  <rect class="carte" x="24" y="50" width="356" height="64" rx="10"/>
  <text class="code" x="202" y="77">deploy/hello/base/</text>
  <text class="sous" x="202" y="99">Commun : Deployment, Service, Ingress</text>

  <rect class="carte" x="24" y="138" width="356" height="64" rx="10"/>
  <text class="code" x="202" y="165">deploy/hello/dev/</text>
  <text class="sous" x="202" y="187">La version de l'image en dev</text>

  <rect class="carte" x="24" y="226" width="356" height="64" rx="10"/>
  <text class="code" x="202" y="253">deploy/hello/prod/</text>
  <text class="sous" x="202" y="275">La version de l'image en prod</text>

  <rect class="dev" x="460" y="138" width="276" height="64" rx="10"/>
  <text class="titre" x="598" y="165">Cluster dev</text>
  <text class="sous" x="598" y="187">hello-dev.alson-lab.fr</text>

  <rect class="prod" x="460" y="226" width="276" height="64" rx="10"/>
  <text class="titre" x="598" y="253">Cluster prod</text>
  <text class="sous" x="598" y="275">hello.alson-lab.fr</text>

  <path class="fleche" d="M390 170 H450 M445 165 l5 5 l-5 5"/>
  <path class="fleche" d="M390 258 H450 M445 253 l5 5 l-5 5"/>
  <path class="commun" d="M390 82 H420 V258"/>
  <text class="note" x="598" y="88">base/ part dans les deux</text>
  <text class="note" x="598" y="108">dev/ et prod/ : chacun dans le sien</text>
</svg>
